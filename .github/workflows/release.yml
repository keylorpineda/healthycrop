name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prebuild & assemble release APK (when Android native project is configured)
        working-directory: app
        run: |
          if [ -f "app.json" ] || [ -f "app.config.ts" ]; then
            npx expo prebuild --platform android --non-interactive
            cd android
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/*.apk "../../healthycrop-${GITHUB_REF_NAME}.apk"
          else
            echo "Expo app configuration not yet initialized; skipping APK assembly."
          fi

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME} of HealthyCrop." > release_notes.md
          fi

      - name: Create GitHub Release with APK and TFLite models
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            healthycrop-*.apk
            ml/models/**/*.tflite
            ml/models/**/registry.json
